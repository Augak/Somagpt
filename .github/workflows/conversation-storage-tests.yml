name: Conversation storage tests

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/conversation-storage.ts'
      - 'tests/conversation-storage.test.mjs'
      - '.github/workflows/conversation-storage-tests.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'src/lib/conversation-storage.ts'
      - 'tests/conversation-storage.test.mjs'
      - '.github/workflows/conversation-storage-tests.yml'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test conversation storage boundaries
        run: npm test
